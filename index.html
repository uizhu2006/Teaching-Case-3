<!DOCTYPE html>

        .phone-frame {
            width: 375px;
            height: 667px;

            border-radius: 3rem;
            overflow: hidden;
            position: relative;
            background: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
        }
        .scroll-hide::-webkit-scrollbar { display: none; }

        .law-badge {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 增加图标的质感 */
        .icon-duotone {
            fill: currentColor;
        }
        .icon-duotone-secondary {
            opacity: 0.4;
        }

                id: 7,
                title: "峰终定律 (Peak-End Rule)",
                problem: "支付完成后只有冷冰冰的文字，体验没有'高潮'和完美句号。",
                law: "体验主要由'最高峰'和'结束时'的感觉决定。给用户惊喜（动画/优惠券）！",
                tip: "点击修复后，注意看动画效果。这就是给用户留下的最后印象（End）。",
            }
        ];

        let currentSceneId = 1;
        let isFixed = false;

        // Custom SVGs for dynamic injection
        const iconStar = `<svg class="w-6 h-6 text-yellow-400 law-badge" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
        const iconCart = `<svg class="w-6 h-6 text-gray-700 law-badge" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>`;
        const badgeRed = `<span class="absolute -top-0.5 -right-0.5 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold border-2 border-white">0</span>`;

        function renderScene() {
            const sceneData = scenes.find(s => s.id === currentSceneId);
            document.getElementById('law-title').innerText = sceneData.title;
            document.getElementById('problem-desc').innerText = sceneData.problem;
            document.getElementById('law-desc').innerText = sceneData.law;
            document.getElementById('teach-tip').innerText = sceneData.tip;

            document.querySelectorAll('.law-btn').forEach(btn => {
                if(parseInt(btn.dataset.id) === currentSceneId) {
                    btn.classList.add('bg-gray-900', 'text-white', 'shadow-md');
                    btn.classList.remove('bg-gray-50', 'text-gray-600');
                } else {
                    btn.classList.remove('bg-gray-900', 'text-white', 'shadow-md');
                    btn.classList.add('bg-gray-50', 'text-gray-600');
                }
            });

            const fixBtn = document.getElementById('fix-btn');
            const screenContainer = document.getElementById('screen-content');
            screenContainer.innerHTML = ''; 
            
            const templateId = `scene-${currentSceneId}-${isFixed ? 'good' : 'bad'}`;
            const template = document.getElementById(templateId);
            
            if(template) {
                const clone = template.content.cloneNode(true);
                screenContainer.appendChild(clone);
            }

            if(isFixed) {
                fixBtn.innerHTML = `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg> <span>还原为糟糕设计</span>`;
                fixBtn.classList.remove('bg-gray-900', 'hover:bg-black');
                fixBtn.classList.add('bg-gray-500', 'hover:bg-gray-600');
                
                if(currentSceneId === 7) launchConfetti();
            } else {
                fixBtn.innerHTML = `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 5.6L10 7 8.6 4.5 10 2 7.5 3.4 5 2l1.4 2.5L5 7zm12 9.8L17 14l1.4 2.5L21 19l-2.5-1.4L17 19l1.4-2.5L17 14zM22 2l-2.5 1.4L17 2l1.4 2.5L17 7l2.5-1.4L22 7l-1.4-2.5zm-8.8 3.8L16 10l-2.8 4.2-1.4-2.5L10 16l-2.8-4.2L3.2 21h17.6l-3.6-5.4z"/></svg> <span>点击运用定律修复</span>`;
                fixBtn.classList.add('bg-gray-900', 'hover:bg-black');
                fixBtn.classList.remove('bg-gray-500', 'hover:bg-gray-600');
            }

            const headerContainer = document.getElementById('header-icon-container');
            if (currentSceneId === 4) {
                 headerContainer.innerHTML = isFixed ? (iconCart + badgeRed) : (iconStar + badgeRed);
            } else {
                headerContainer.innerHTML = iconCart + badgeRed;
            }
        }

        function switchScene(id) {
            currentSceneId = id;
            isFixed = false;
            renderScene();
        }

        function toggleFix() {
            isFixed = !isFixed;
            renderScene();
        }

        function launchConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            var randomInRange = (min, max) => Math.random() * (max - min) + min;

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) { return clearInterval(interval); }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        renderScene();
    </script>
</body>
</html>
